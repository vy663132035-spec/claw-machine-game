<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Gắp Thú</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #8dd3ff 0%, #f7d2ff 45%, #ffd9cf 100%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap {
      width: min(980px, 100%);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.94);
      border-radius: 18px;
      padding: 18px 22px;
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 900;
      color: #1d3557;
    }
    .timer {
      min-width: 110px;
      text-align: center;
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 900;
      color: #1d4ed8;
      transition: color .2s ease;
    }
    .timer.warning { color: #ef4444; animation: blink .5s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: .4; } }

    .machine-outer {
      position: relative;
      width: 100%;
      height: 420px;
      background: linear-gradient(to bottom, #ffd86c, #ffaf2d);
      border: 6px solid #8b4a24;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 32px rgba(0,0,0,.18);
      cursor: pointer;
      user-select: none;
    }
    .machine-outer.closed {
      background: linear-gradient(to bottom, #1a1a1a, #090909);
    }

    /* Hộp trắng bên trong */
    .machine {
      position: absolute;
      inset: 22px 18px 18px 18px;
      background: #f8f8f8;
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      z-index: 1;
    }

    .machine.closed {
      background: rgba(0,0,0,.6);
    }

    /* Cần câu container - di chuyển trái phải */
    .claw-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Cần câu chính (phần trên + phần kéo xuống) */
    .claw {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .claw-head {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .claw-finger {
      position: absolute;
      width: 12px;
      height: 42px;
      top: 0;
      background: linear-gradient(#d7d7d7, #777);
      border-radius: 12px;
      transition: transform .2s ease;
    }

    .claw-finger.left {
      left: 14px;
      transform: rotate(-28deg);
      transform-origin: center bottom;
    }

    .claw-finger.right {
      right: 14px;
      transform: rotate(28deg);
      transform-origin: center bottom;
    }

    .claw.closed .claw-finger.left {
      transform: rotate(-8deg);
    }

    .claw.closed .claw-finger.right {
      transform: rotate(8deg);
    }

    /* Phần dây kéo xuống */
    .claw-rope {
      width: 4px;
      background: #444;
      border-radius: 2px;
      min-height: 0;
      flex-grow: 1;
    }

    /* Thú bông */
    .pet {
      position: absolute;
      bottom: 26px;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      z-index: 3;
      animation: sway 12s ease-in-out infinite;
    }

    @keyframes sway {
      0% { left: 16px; }
      50% { left: calc(100% - 82px); }
      100% { left: 16px; }
    }

    .machine.closed .pet {
      filter: brightness(.25) grayscale(1);
      animation: none;
      opacity: .2;
    }

    .instruction {
      text-align: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      margin-top: 12px;
      text-shadow: 0 2px 5px rgba(0,0,0,.25);
    }

    .result {
      display: none;
      background: rgba(255,255,255,.96);
      border-radius: 18px;
      margin-top: 18px;
      padding: 22px 16px;
      box-shadow: 0 16px 32px rgba(0,0,0,.15);
    }

    .result.show { display: block; }

    .result-title {
      text-align: center;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 900;
      color: #1d4ed8;
      margin: 0 0 18px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .panel {
      min-height: 180px;
      border-radius: 16px;
      padding: 16px;
    }

    .panel.saved {
      background: #eafaf0;
      border: 3px solid #2ebf62;
    }

    .panel.lost {
      background: #fff0f0;
      border: 3px solid #f04d4d;
    }

    .panel h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(18px, 2.4vw, 28px);
    }

    .panel.saved h2 { color: #1a9f46; }
    .panel.lost h2 { color: #de3a3a; }

    .animals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
      gap: 12px;
      justify-items: center;
    }

    .animal {
      font-size: 54px;
      min-width: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .animal.saved { animation: hop .7s ease-in-out; }
    .animal.lost { filter: grayscale(100%) opacity(.72); animation: wobble .7s ease-in-out; }

    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .empty {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 18px 0;
    }

    .restart {
      display: block;
      margin: 18px auto 0;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(76,70,200,.25);
    }

    .caught {
      position: fixed;
      font-size: 78px;
      z-index: 2000;
      pointer-events: none;
      animation: fly .9s ease-out forwards;
    }

    @keyframes fly {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1) rotate(0deg); }
      35% { opacity: 1; transform: translate(-50%, -110px) scale(1.2) rotate(10deg); }
      100% { opacity: 0; transform: translate(-50%, -320px) scale(0.8) rotate(-18deg); }
    }

    @media (max-width: 700px) {
      .result-grid { grid-template-columns: 1fr; }
      .machine-outer { height: 320px; }
      .topbar { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>🎮 Game Gắp Thú</h1>
      <div class="timer" id="timer">40</div>
    </div>

    <div class="machine-outer" id="machineOuter">
      <div class="machine" id="machine">
        <!-- Cần câu di chuyển trái phải -->
        <div class="claw-container" id="clawContainer">
          <div class="claw" id="claw">
            <div class="claw-head">
              <div class="claw-finger left"></div>
              <div class="claw-finger right"></div>
            </div>
            <div class="claw-rope" id="rope"></div>
          </div>
        </div>

        <!-- Thú bông -->
        <div class="pet">🐰</div>
        <div class="pet" style="left: 22%; animation-delay: .7s;">🐻</div>
        <div class="pet" style="left: 42%; animation-delay: 1.4s;">🐸</div>
        <div class="pet" style="left: 62%; animation-delay: 2.2s;">🐧</div>
        <div class="pet" style="left: 77%; animation-delay: 3.1s;">🦊</div>
        <div class="pet" style="left: 90%; animation-delay: 4.5s;">🐱</div>
      </div>
    </div>

    <div class="instruction">👈 Nhấn chuột để dừng cần câu và gắp thú 👉</div>

    <div class="result" id="result">
      <h2 class="result-title">🎊 Game Kết Thúc! 🎊</h2>
      <div class="result-grid">
        <div class="panel saved">
          <h2>✨ Thú Đã Cứu ✨</h2>
          <div class="animals" id="savedList"></div>
        </div>
        <div class="panel lost">
          <h2>😢 Thú Bị Nhốt 😢</h2>
          <div class="animals" id="lostList"></div>
        </div>
      </div>
      <button class="restart" onclick="location.reload()">🔄 Chơi lại</button>
    </div>
  </div>

  <script>
    const machineOuter = document.getElementById('machineOuter');
    const machine = document.getElementById('machine');
    const clawContainer = document.getElementById('clawContainer');
    const claw = document.getElementById('claw');
    const timerEl = document.getElementById('timer');
    const resultEl = document.getElementById('result');
    const savedListEl = document.getElementById('savedList');
    const lostListEl = document.getElementById('lostList');
    const rope = document.getElementById('rope');

    let timeLeft = 40;
    let direction = 1;
    let clawPos = 50;
    let clawMoving = true;
    let gameOn = true;
    let saved = [];
    let lost = [];
    let clawLowered = false;

    function updateTimer() {
      timerEl.textContent = timeLeft;
      if (timeLeft <= 10) timerEl.classList.add('warning');
    }

    // Cần câu di chuyển trái phải với tốc độ 1/2 (chậm hơn 2 lần)
    setInterval(() => {
      if (!gameOn || !clawMoving) return;
      clawPos += direction * 0.9; // Từ 1.8 xuống 0.9 = 1/2 tốc độ
      if (clawPos <= 18 || clawPos >= 82) direction *= -1;
      clawContainer.style.left = clawPos + '%';
    }, 25);

    const timerLoop = setInterval(() => {
      if (!gameOn) return;
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) {
        endGame();
        clearInterval(timerLoop);
      }
    }, 1000);

    machine.addEventListener('click', () => {
      if (!gameOn || !clawMoving) return;
      clawMoving = false;
      claw.classList.add('closed');

      const pets = [...document.querySelectorAll('.pet')];
      const machineRect = machine.getBoundingClientRect();
      const clawHeadRect = claw.querySelector('.claw-head').getBoundingClientRect();
      
      let target = null;

      // Kiểm tra va chạm giữa phần móc câu và thú bông
      for (const pet of pets) {
        const petRect = pet.getBoundingClientRect();
        const intersects = 
          clawHeadRect.left < petRect.right &&
          clawHeadRect.right > petRect.left &&
          clawHeadRect.bottom > petRect.top;
        
        if (intersects && pet.style.opacity !== '0') {
          target = pet;
          break;
        }
      }

      lowerClaw(() => {
        if (target) {
          const emoji = target.textContent.trim();
          saved.push(emoji);
          const x = target.getBoundingClientRect().left + target.offsetWidth / 2;
          const y = target.getBoundingClientRect().top + 10;
          spawnFloatEmoji(emoji, x, y);
          target.style.opacity = '0';
          target.style.transform = 'scale(.4)';
        }

        setTimeout(() => {
          raiseClaw(() => {
            claw.classList.remove('closed');
            clawMoving = true;
          });
        }, 520);
      });
    });

    function lowerClaw(callback) {
      let h = 0;
      const maxH = machine.offsetHeight - claw.querySelector('.claw-head').offsetHeight - 20;
      const iv = setInterval(() => {
        h += 8;
        rope.style.height = h + 'px';
        if (h >= maxH) {
          clearInterval(iv);
          callback();
        }
      }, 18);
    }

    function raiseClaw(callback) {
      let h = machine.offsetHeight - claw.querySelector('.claw-head').offsetHeight - 20;
      const iv = setInterval(() => {
        h -= 8;
        rope.style.height = h + 'px';
        if (h <= 0) {
          clearInterval(iv);
          rope.style.height = '0px';
          callback();
        }
      }, 18);
    }

    function spawnFloatEmoji(emoji, x, y) {
      const el = document.createElement('div');
      el.className = 'caught';
      el.textContent = emoji;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }

    function endGame() {
      gameOn = false;
      clawMoving = false;
      machineOuter.classList.add('closed');
      machine.classList.add('closed');

      const allPets = [...document.querySelectorAll('.pet')];
      for (const pet of allPets) {
        if (pet.style.opacity === '0') continue;
        lost.push(pet.textContent.trim());
      }

      setTimeout(() => {
        resultEl.classList.add('show');
        if (saved.length) {
          savedListEl.innerHTML = saved.map(e => `<div class="animal saved">${e}</div>`).join('');
        } else {
          savedListEl.innerHTML = '<div class="empty">Không có thú nào được cứu 😭</div>';
        }

        if (lost.length) {
          lostListEl.innerHTML = lost.map(e => `<div class="animal lost">${e}</div>`).join('');
        } else {
          lostListEl.innerHTML = '<div class="empty">Tất cả đã được cứu! 🎉</div>';
        }
      }, 500);
    }
  </script>
</body>
</html>
