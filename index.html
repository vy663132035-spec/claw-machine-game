<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Gắp Thú</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #7fd4ff 0%, #f5d0ff 40%, #ffd6d6 100%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .game-wrap {
      width: min(980px, 100%);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.93);
      border-radius: 18px;
      padding: 18px 22px;
      box-shadow: 0 12px 28px rgba(0,0,0,.15);
      margin-bottom: 18px;
    }
    .title {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      color: #1d3557;
      margin: 0;
    }
    .timer {
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 800;
      min-width: 90px;
      text-align: center;
      color: #1d4ed8;
      transition: color .2s ease;
    }
    .timer.warning {
      color: #ef4444;
      animation: blink .5s infinite alternate;
    }
    @keyframes blink {
      from { opacity: 1; }
      to { opacity: .4; }
    }
    .machine {
      position: relative;
      width: 100%;
      height: 420px;
      background: linear-gradient(to bottom, #ffd75b, #ffaf2d);
      border: 6px solid #8b4a24;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(0,0,0,.18);
      cursor: pointer;
      user-select: none;
    }
    .machine.closed {
      background: linear-gradient(to bottom, #1a1a1a, #080808);
    }
    .glass {
      position: absolute;
      inset: 22px 18px 18px 18px;
      border: 4px solid rgba(255,255,255,.55);
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      pointer-events: none;
      z-index: 2;
    }
    .machine.closed .glass {
      background: rgba(0,0,0,.18);
      border-color: rgba(255,255,255,.15);
    }
    .claw {
      position: absolute;
      top: 20px;
      left: 50%;
      width: 80px;
      height: 120px;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }
    .claw-head {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .claw-finger {
      position: absolute;
      width: 12px;
      height: 42px;
      top: 0;
      background: linear-gradient(#d9d9d9, #7b7b7b);
      border-radius: 12px;
      transition: transform .2s ease;
    }
    .claw-finger.left {
      left: 14px;
      transform: rotate(-28deg);
      transform-origin: center bottom;
    }
    .claw-finger.right {
      right: 14px;
      transform: rotate(28deg);
      transform-origin: center bottom;
    }
    .claw.closed .claw-finger.left {
      transform: rotate(-8deg);
    }
    .claw.closed .claw-finger.right {
      transform: rotate(8deg);
    }
    .claw-rope {
      position: absolute;
      left: 50%;
      top: 75px;
      width: 4px;
      height: 0;
      transform: translateX(-50%);
      background: #444;
      border-radius: 2px;
    }
    .pet {
      position: absolute;
      bottom: 26px;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      z-index: 3;
      animation: sway 6s ease-in-out infinite;
    }
    @keyframes sway {
      0% { left: 16px; }
      50% { left: calc(100% - 82px); }
      100% { left: 16px; }
    }
    .machine.closed .pet {
      filter: brightness(.25) grayscale(1);
      animation: none;
      opacity: .2;
    }
    .instruction {
      margin-top: 12px;
      text-align: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 2px 5px rgba(0,0,0,.25);
    }
    .result {
      display: none;
      background: rgba(255,255,255,.96);
      border-radius: 18px;
      margin-top: 18px;
      padding: 22px 18px;
      box-shadow: 0 16px 32px rgba(0,0,0,.15);
    }
    .result.show {
      display: block;
    }
    .result-title {
      text-align: center;
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 16px;
      color: #1d4ed8;
      font-weight: 900;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .panel {
      border-radius: 16px;
      padding: 16px;
      min-height: 180px;
    }
    .panel.saved {
      background: #eafaf0;
      border: 3px solid #2ebf62;
    }
    .panel.lost {
      background: #fff0f0;
      border: 3px solid #f04d4d;
    }
    .panel h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(18px, 2.4vw, 28px);
    }
    .panel.saved h2 { color: #1a9f46; }
    .panel.lost h2 { color: #de3a3a; }
    .animals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      gap: 12px;
      justify-items: center;
    }
    .animal {
      font-size: 54px;
      min-width: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .animal.saved {
      animation: hop .7s ease-in-out;
    }
    .animal.lost {
      filter: grayscale(100%) opacity(.7);
      animation: wobble .7s ease-in-out;
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    .empty {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 18px 0;
    }
    .restart {
      display: block;
      margin: 18px auto 0;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(76,70,200,.3);
    }
    .caught {
      position: fixed;
      font-size: 78px;
      z-index: 2000;
      pointer-events: none;
      animation: floatUp 1.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1) rotate(0deg); }
      30% { opacity: 1; transform: translate(-50%, -110px) scale(1.2) rotate(12deg); }
      100% { opacity: 0; transform: translate(-50%, -360px) scale(0.8) rotate(-18deg); }
    }
    @media (max-width: 700px) {
      .result-grid { grid-template-columns: 1fr; }
      .machine { height: 320px; }
      .topbar { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="topbar">
      <h1 class="title">🎮 Game Gắp Thú</h1>
      <div class="timer" id="timer">40</div>
    </div>

    <div class="machine" id="machine">
      <div class="glass"></div>

      <div class="claw" id="claw">
        <div class="claw-head">
          <div class="claw-finger left"></div>
          <div class="claw-finger right"></div>
        </div>
        <div class="claw-rope" id="rope"></div>
      </div>

      <div class="pet">🐰</div>
      <div class="pet" style="left: 22%; animation-delay: 0.7s;">🐻</div>
      <div class="pet" style="left: 42%; animation-delay: 1.4s;">🐸</div>
      <div class="pet" style="left: 61%; animation-delay: 2.2s;">🐧</div>
      <div class="pet" style="left: 77%; animation-delay: 3.1s;">🦊</div>
      <div class="pet" style="left: 90%; animation-delay: 4.5s;">🐱</div>
    </div>

    <div class="instruction">👈 Nhấn chuột để dừng cần câu và gắp thú 👉</div>

    <div class="result" id="result">
      <h2 class="result-title">🎊 Game Kết Thúc! 🎊</h2>
      <div class="result-grid">
        <div class="panel saved">
          <h2>✨ Thú Đã Cứu ✨</h2>
          <div class="animals" id="savedList"></div>
        </div>
        <div class="panel lost">
          <h2>😢 Thú Bị Nhốt 😢</h2>
          <div class="animals" id="lostList"></div>
        </div>
      </div>
      <button class="restart" onclick="location.reload()">🔄 Chơi lại</button>
    </div>
  </div>

  <script>
    const machine = document.getElementById('machine');
    const claw = document.getElementById('claw');
    const timerEl = document.getElementById('timer');
    const resultEl = document.getElementById('result');
    const savedListEl = document.getElementById('savedList');
    const lostListEl = document.getElementById('lostList');
    const rope = document.getElementById('rope');

    let timeLeft = 40;
    let direction = 1;
    let clawPos = 50;
    let clawMoving = true;
    let gameOn = true;
    let saved = [];
    let lost = [];

    function updateTimer() {
      timerEl.textContent = timeLeft;
      if (timeLeft <= 10) timerEl.classList.add('warning');
    }

    setInterval(() => {
      if (!gameOn || !clawMoving) return;
      clawPos += direction * 1.8;
      if (clawPos <= 18 || clawPos >= 82) direction *= -1;
      claw.style.left = clawPos + '%';
    }, 25);

    const timerLoop = setInterval(() => {
      if (!gameOn) return;
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) {
        endGame();
        clearInterval(timerLoop);
      }
    }, 1000);

    machine.addEventListener('click', () => {
      if (!gameOn || !clawMoving) return;

      clawMoving = false;
      claw.classList.add('closed');

      const petEls = [...document.querySelectorAll('.pet')];
      const clawCenterX = claw.getBoundingClientRect().left + claw.offsetWidth / 2;
      let target = null;

      for (const pet of petEls) {
        const rect = pet.getBoundingClientRect();
        const intersects = clawCenterX >= rect.left && clawCenterX <= rect.right;
        if (intersects && rect.top < 260) {
          target = pet;
          break;
        }
      }

      lowerClaw(() => {
        if (target) {
          const emoji = target.textContent.trim();
          saved.push(emoji);
          const x = target.getBoundingClientRect().left + target.offsetWidth / 2;
          const y = target.getBoundingClientRect().top + 10;
          spawnFloatEmoji(emoji, x, y);
          target.style.opacity = '0';
          target.style.transform = 'scale(.4)';
        }

        setTimeout(() => {
          raiseClaw(() => {
            claw.classList.remove('closed');
            clawMoving = true;
          });
        }, 520);
      });
    });

    function lowerClaw(callback) {
      let h = 0;
      const iv = setInterval(() => {
        h += 8;
        rope.style.height = h + 'px';
        if (h >= 240) {
          clearInterval(iv);
          callback();
        }
      }, 18);
    }

    function raiseClaw(callback) {
      let h = 240;
      const iv = setInterval(() => {
        h -= 8;
        rope.style.height = h + 'px';
        if (h <= 0) {
          clearInterval(iv);
          callback();
        }
      }, 18);
    }

    function spawnFloatEmoji(emoji, x, y) {
      const el = document.createElement('div');
      el.className = 'caught';
      el.textContent = emoji;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }

    function endGame() {
      gameOn = false;
      clawMoving = false;
      machine.classList.add('closed');

      const allPets = [...document.querySelectorAll('.pet')];
      for (const pet of allPets) {
        if (pet.style.opacity === '0') continue;
        lost.push(pet.textContent.trim());
      }

      setTimeout(() => {
        resultEl.classList.add('show');

        if (saved.length) {
          savedListEl.innerHTML = saved.map(e => `<div class="animal saved">${e}</div>`).join('');
        } else {
          savedListEl.innerHTML = '<div class="empty">Không có thú nào được cứu 😭</div>';
        }

        if (lost.length) {
          lostListEl.innerHTML = lost.map(e => `<div class="animal lost">${e}</div>`).join('');
        } else {
          lostListEl.innerHTML = '<div class="empty">Tất cả đã được cứu! 🎉</div>';
        }
      }, 500);
    }
  </script>
</body>
</html>
