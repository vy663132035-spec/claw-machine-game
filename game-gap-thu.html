<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gắp Thú</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
        }

        .game-title {
            text-align: center;
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            font-weight: bold;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .timer {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            min-width: 100px;
            text-align: center;
        }

        .timer.warning {
            color: #ff6b6b;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        .score-info {
            text-align: center;
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }

        .game-screen {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* Máy gắp thú */
        .machine {
            position: relative;
            width: 100%;
            height: 400px;
            background: linear-gradient(to bottom, #FFD700 0%, #FFA500 100%);
            border: 5px solid #8B4513;
            cursor: pointer;
            overflow: hidden;
        }

        .machine::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
            border-bottom: 3px solid rgba(0, 0, 0, 0.1);
        }

        .machine::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.2), transparent);
        }

        /* Khung kính máy */
        .glass-border {
            position: absolute;
            top: 20px;
            left: 15px;
            right: 15px;
            bottom: 20px;
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            pointer-events: none;
            z-index: 2;
        }

        /* Cần câu */
        .claw {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 60px;
            height: 80px;
        }

        .claw-head {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto;
        }

        .claw-finger {
            position: absolute;
            width: 12px;
            height: 40px;
            background: #C0C0C0;
            border-radius: 6px;
            top: 0;
            transition: transform 0.3s ease;
        }

        .claw-finger.left {
            left: 5px;
            transform: rotate(-25deg);
            transform-origin: center bottom;
        }

        .claw-finger.right {
            right: 5px;
            transform: rotate(25deg);
            transform-origin: center bottom;
        }

        .claw.closed .claw-finger.left {
            transform: rotate(-5deg);
        }

        .claw.closed .claw-finger.right {
            transform: rotate(5deg);
        }

        .claw-rope {
            position: absolute;
            width: 3px;
            background: #666;
            left: 50%;
            transform: translateX(-50%);
            height: 0;
            top: 60px;
        }

        /* Thú bông trong máy */
        .stuffed-animal {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            bottom: 30px;
            cursor: default;
            animation: move-horizontal 6s infinite linear;
        }

        @keyframes move-horizontal {
            0% { left: 20px; }
            50% { left: calc(100% - 70px); }
            100% { left: 20px; }
        }

        .stuffed-animal:nth-child(2) {
            animation-delay: 0s;
        }

        .stuffed-animal:nth-child(3) {
            animation-delay: 2s;
        }

        .stuffed-animal:nth-child(4) {
            animation-delay: 4s;
        }

        .stuffed-animal:nth-child(5) {
            animation-delay: 1s;
        }

        .stuffed-animal:nth-child(6) {
            animation-delay: 3s;
        }

        /* Thú bông được gắp ra ngoài */
        .caught-animal {
            position: fixed;
            font-size: 80px;
            z-index: 100;
            animation: caught-dance 2s ease-out forwards;
        }

        @keyframes caught-dance {
            0% {
                opacity: 1;
                transform: translateY(-50px) scale(1) rotate(0deg);
            }
            50% {
                transform: translateY(-200px) scale(1.2) rotate(10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-400px) scale(0.5) rotate(-20deg);
            }
        }

        /* Kết quả */
        .result-screen {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-screen.show {
            display: block;
        }

        .result-title {
            text-align: center;
            font-size: 36px;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .result-section {
            padding: 20px;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .result-section.saved {
            border: 3px solid #4CAF50;
            background: #E8F5E9;
        }

        .result-section.lost {
            border: 3px solid #f44336;
            background: #FFEBEE;
        }

        .result-section h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .result-section.saved h2 {
            color: #4CAF50;
        }

        .result-section.lost h2 {
            color: #f44336;
        }

        .animals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            justify-items: center;
        }

        .result-animal {
            font-size: 60px;
            text-align: center;
        }

        .result-animal.sad {
            filter: grayscale(100%) opacity(0.7);
            animation: sad-wobble 0.6s ease-in-out;
        }

        @keyframes sad-wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        .result-animal.happy {
            animation: happy-jump 0.6s ease-in-out;
        }

        @keyframes happy-jump {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .restart-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        /* Máy đóng lại */
        .machine.closed {
            background: linear-gradient(to bottom, #333 0%, #111 100%);
        }

        .machine.closed .glass-border {
            border-color: #000;
            background: rgba(0, 0, 0, 0.8);
        }

        .machine.closed .stuffed-animal {
            animation: none;
            filter: brightness(0.3);
        }

        .instruction {
            text-align: center;
            color: white;
            font-size: 16px;
            margin-top: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 36px;
            }

            .results-container {
                grid-template-columns: 1fr;
            }

            .machine {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🎮 GAME GẮP THÚ 🎮</h1>
        
        <div class="game-info">
            <div class="timer" id="timer">40</div>
            <div class="score-info">
                Thú đã cứu: <span id="savedCount">0</span>
            </div>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="machine" id="machine">
                <div class="glass-border"></div>
                <div class="claw" id="claw">
                    <div class="claw-head">
                        <div class="claw-finger left"></div>
                        <div class="claw-finger right"></div>
                    </div>
                    <div class="claw-rope" id="clawRope"></div>
                </div>

                <!-- Thú bông trong máy -->
                <div class="stuffed-animal">🐰</div>
                <div class="stuffed-animal">🐻</div>
                <div class="stuffed-animal">🐸</div>
                <div class="stuffed-animal">🐧</div>
                <div class="stuffed-animal">🦊</div>
                <div class="stuffed-animal">🐱</div>
            </div>
            <div class="instruction">👈 Nhấn chuột để dừng cần câu và gắp thú 👉</div>
        </div>

        <div class="result-screen" id="resultScreen">
            <div class="result-title">🎊 GAME KẾT THÚC! 🎊</div>

            <div class="results-container">
                <div class="result-section saved">
                    <h2>✨ Thú Đã Cứu ✨</h2>
                    <div class="animals-grid" id="savedAnimals"></div>
                </div>

                <div class="result-section lost">
                    <h2>😢 Thú Bị Nhốt 😢</h2>
                    <div class="animals-grid" id="lostAnimals"></div>
                </div>
            </div>

            <button class="restart-btn" onclick="location.reload()">🔄 CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const animalEmojis = ['🐰', '🐻', '🐸', '🐧', '🦊', '🐱'];
        const animalNames = ['Thỏ', 'Gấu', 'Ếch', 'Chim cánh cụt', 'Cáo', 'Mèo'];

        let gameActive = true;
        let timeLeft = 40;
        let clawPosition = 0;
        let clawMoving = true;
        let savedAnimals = [];
        let lostAnimals = [];

        const machine = document.getElementById('machine');
        const claw = document.getElementById('claw');
        const timer = document.getElementById('timer');
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');
        const savedAnimalsDiv = document.getElementById('savedAnimals');
        const lostAnimalsDiv = document.getElementById('lostAnimals');
        const savedCount = document.getElementById('savedCount');

        // Di chuyển cần câu trái phải
        let direction = 1;
        const moveClawInterval = setInterval(() => {
            if (gameActive && clawMoving) {
                clawPosition += direction * 2;
                
                if (clawPosition <= 0 || clawPosition >= 100) {
                    direction *= -1;
                }
                
                claw.style.left = clawPosition + '%';
                claw.style.transform = `translateX(-50%)`;
            }
        }, 20);

        // Đếm ngược thời gian
        const timerInterval = setInterval(() => {
            if (!gameActive) return;

            timeLeft--;
            timer.textContent = timeLeft;

            if (timeLeft <= 10) {
                timer.classList.add('warning');
            }

            if (timeLeft <= 0) {
                endGame();
                clearInterval(timerInterval);
            }
        }, 1000);

        // Nhấn chuột để gắp thú
        machine.addEventListener('click', (e) => {
            if (!gameActive || !clawMoving) return;

            clawMoving = false;

            // Các thú bông hiện tại
            const animals = document.querySelectorAll('.stuffed-animal');
            const clawRect = claw.getBoundingClientRect();
            const machineRect = machine.getBoundingClientRect();

            let caughtAnimal = null;

            // Kiểm tra xem cần câu có chạm vào thú nào không
            animals.forEach((animal) => {
                const animalRect = animal.getBoundingClientRect();
                const clawCenter = clawRect.left + clawRect.width / 2;

                if (
                    clawCenter >= animalRect.left &&
                    clawCenter <= animalRect.right &&
                    clawRect.bottom >= animalRect.top
                ) {
                    caughtAnimal = animal;
                }
            });

            // Đóng caws
            claw.classList.add('closed');

            // Kéo xuống
            pullDown(() => {
                if (caughtAnimal) {
                    // Gắp thành công
                    const emoji = caughtAnimal.textContent;
                    const index = animalEmojis.indexOf(emoji);
                    savedAnimals.push({ emoji, name: animalNames[index] });
                    savedCount.textContent = savedAnimals.length;

                    // Làm mất thú bông
                    caughtAnimal.style.opacity = '0';
                    caughtAnimal.style.pointerEvents = 'none';

                    // Animation thú bông vui vẻ
                    showCaughtAnimation(emoji, e.clientX, e.clientY);
                }

                // Kéo lên
                setTimeout(() => {
                    pullUp(() => {
                        claw.classList.remove('closed');
                        clawMoving = true;
                    });
                }, 500);
            });
        });

        function pullDown(callback) {
            let distance = 0;
            const maxDistance = 280;
            const interval = setInterval(() => {
                distance += 5;
                document.getElementById('clawRope').style.height = distance + 'px';

                if (distance >= maxDistance) {
                    clearInterval(interval);
                    callback();
                }
            }, 20);
        }

        function pullUp(callback) {
            let distance = 280;
            const interval = setInterval(() => {
                distance -= 5;
                document.getElementById('clawRope').style.height = distance + 'px';

                if (distance <= 0) {
                    clearInterval(interval);
                    callback();
                }
            }, 20);
        }

        function showCaughtAnimation(emoji, x, y) {
            const caught = document.createElement('div');
            caught.className = 'caught-animal';
            caught.textContent = emoji;
            caught.style.left = x + 'px';
            caught.style.top = y + 'px';
            document.body.appendChild(caught);

            setTimeout(() => {
                caught.remove();
            }, 2000);
        }

        function endGame() {
            gameActive = false;
            clawMoving = false;

            // Máy đóng lại
            machine.classList.add('closed');

            // Thu thập các thú bông còn lại
            const remainingAnimals = document.querySelectorAll('.stuffed-animal:not([style*="opacity: 0"])');
            remainingAnimals.forEach((animal) => {
                const emoji = animal.textContent;
                const index = animalEmojis.indexOf(emoji);
                lostAnimals.push({ emoji, name: animalNames[index] });
            });

            // Hiển thị kết quả
            setTimeout(() => {
                showResults();
            }, 1000);
        }

        function showResults() {
            gameScreen.style.display = 'none';
            resultScreen.classList.add('show');

            // Hiển thị thú đã cứu
            if (savedAnimals.length > 0) {
                savedAnimalsDiv.innerHTML = savedAnimals
                    .map((a) => `<div class="result-animal happy">${a.emoji}</div>`)
                    .join('');
            } else {
                savedAnimalsDiv.innerHTML = '<div class="empty-message">Không có thú nào được cứu 😭</div>';
            }

            // Hiển thị thú bị nhốt
            if (lostAnimals.length > 0) {
                lostAnimalsDiv.innerHTML = lostAnimals
                    .map((a) => `<div class="result-animal sad">${a.emoji}</div>`)
                    .join('');
            } else {
                lostAnimalsDiv.innerHTML = '<div class="empty-message">Tất cả đã được cứu! 🎉</div>';
            }
        }

        // Dừng interval khi trang bị đóng
        window.addEventListener('beforeunload', () => {
            clearInterval(moveClawInterval);
            clearInterval(timerInterval);
        });
    </script>
</body>
</html>
